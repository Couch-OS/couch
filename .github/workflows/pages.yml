name: Redirect former Couch site URLs

on:
  push:
    branches: [main]
    paths: ['site/redirect.html', 'tools/build-pages-redirects.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Build path-preserving redirects
        run: python3 tools/build-pages-redirects.py --template site/redirect.html --output build/pages-redirects
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages-redirects
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

name: Build installer binaries
on:
  push:
    branches: [main]
    paths: ['tools/installer/**', '.github/workflows/installer-binaries.yml']
  pull_request:
    paths: ['tools/installer/**', '.github/workflows/installer-binaries.yml']
  workflow_dispatch:
concurrency:
  group: installer-binaries-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  isolated-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Export the standalone installer source closure
        run: |
          python3 tools/installer/test_export_source.py
          python3 tools/installer/export_source.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/couch-installer-source"
          test ! -e "$RUNNER_TEMP/couch-installer-source/.git"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ${{ runner.temp }}/couch-installer-source/tools/installer/host
            ${{ runner.temp }}/couch-installer-source/tools/installer/tui
            ${{ runner.temp }}/couch-installer-source/tools/installer/linux_stage/probe
            ${{ runner.temp }}/couch-installer-source/tools/installer/linux_stage/storage
      - name: Test host, terminal UI and RAM stage from exported source only
        working-directory: ${{ runner.temp }}/couch-installer-source
        run: |
          python3 -m unittest discover -s tools/installer -p 'test_*.py'
          python3 tools/installer/bump_version.py --check
          cargo test --locked --manifest-path tools/installer/host/Cargo.toml
          cargo test --locked --manifest-path tools/installer/tui/Cargo.toml
          cargo test --locked --manifest-path tools/installer/linux_stage/probe/Cargo.toml --features private-install
          cargo test --locked --manifest-path tools/installer/linux_stage/storage/Cargo.toml

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, platform: linux-x64, extension: ''}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, platform: linux-arm64, extension: ''}
          - {os: macos-15, target: aarch64-apple-darwin, platform: macos-arm64, extension: ''}
          - {os: macos-15, target: x86_64-apple-darwin, platform: macos-x64, extension: ''}
          - {os: windows-2022, target: x86_64-pc-windows-msvc, platform: windows-x64, extension: '.exe'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/installer/tui
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      # Cache the dependency build: couch-installer-host pulls reqwest, rustls,
      # ring and zip, and four workflows rebuilt all of it on every runner.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tools/installer/tui
            tools/installer/host
      - name: Test host UI and protocol
        run: cargo test --locked
      - name: Build binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Test native host
        working-directory: tools/installer/host
        run: cargo test --locked
      - name: Build native host
        working-directory: tools/installer/host
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Verify Windows binaries do not require the VC redistributable
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        run: |
          rustup component add llvm-tools
          if ($LASTEXITCODE -ne 0) { throw 'Could not install LLVM inspection tools' }
          $couchToolchain = rustc --print sysroot
          $couchReader = Join-Path $couchToolchain 'lib/rustlib/x86_64-pc-windows-msvc/bin/llvm-readobj.exe'
          foreach ($component in @('host', 'tui')) {
            $binary = "tools/installer/$component/target/x86_64-pc-windows-msvc/release/couch-installer-$component.exe"
            $imports = & $couchReader --coff-imports $binary
            if ($LASTEXITCODE -ne 0) { throw "Could not inspect $component imports" }
            if ($imports -match '(?i)Name: (VCRUNTIME|MSVCP|MSVCR|CONCRT)[^ ]*\.dll') {
              throw "$component still requires the Visual C++ redistributable"
            }
            Write-Host "$component imports verified"
          }
      - name: Record compiler and binary provenance
        working-directory: .
        run: |
          python tools/installer/test_binary_receipt.py
          python tools/installer/binary_receipt.py --platform ${{ matrix.platform }} --output installer-build/build.json
      - uses: actions/upload-artifact@v4
        with:
          name: couch-installer-build-${{ matrix.platform }}
          path: installer-build/build.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: couch-installer-tui-${{ matrix.platform }}
          path: tools/installer/tui/target/${{ matrix.target }}/release/couch-installer-tui${{ matrix.extension }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: couch-installer-host-${{ matrix.platform }}
          path: tools/installer/host/target/${{ matrix.target }}/release/couch-installer-host${{ matrix.extension }}
          if-no-files-found: error
  macos-universal:
    needs: native
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: couch-installer-*-macos-*
          path: binaries
      - name: Combine Intel and Apple Silicon
        run: |
          mkdir -p universal
          for component in tui host; do
            name="couch-installer-$component"
            lipo -create "binaries/$name-macos-x64/$name" "binaries/$name-macos-arm64/$name" -output "universal/$name"
            chmod +x "universal/$name"
            lipo "universal/$name" -verify_arch x86_64 arm64
            codesign --force --sign - "universal/$name"
            codesign --verify --strict "universal/$name"
          done
      - name: Bind universal binaries to native build receipts
        run: python tools/installer/binary_receipt.py --platform macos-universal --output universal/build.json
      - uses: actions/upload-artifact@v4
        with:
          name: couch-installer-build-macos-universal
          path: universal/build.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: couch-installer-tui-macos-universal
          path: universal/couch-installer-tui
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: couch-installer-host-macos-universal
          path: universal/couch-installer-host
          if-no-files-found: error

name: Apple TV client
on:
  push:
    paths: ['clients/couch-appletv/**', 'clients/Cargo.lock', '.github/workflows/appletv-client.yml']
  pull_request:
    paths: ['clients/couch-appletv/**', 'clients/Cargo.lock', '.github/workflows/appletv-client.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - run: cargo test --locked --manifest-path clients/Cargo.toml -p couch-appletv
      - run: cargo fmt --manifest-path clients/Cargo.toml -p couch-appletv --check
      - run: cargo clippy --locked --manifest-path clients/Cargo.toml -p couch-appletv --all-targets -- -D warnings

name: Firmware restore pin watch
# Detects when the vendor's pinned Android OTA changes and opens a pull request
# updating the repo-pinned hashes. It never mirrors firmware bytes into the repo
# or a release: the installer always fetches the OTA from the vendor source at
# install time and trusts only the repo-pinned hashes. This job just detects drift.
on:
  schedule:
    # Daily. Fail-soft on Google Drive quota so it never spams pull requests.
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      upload_firmware_artifact:
        description: 'Upload the downloaded OTA as a build artifact (redistribution review required; off by default)'
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: firmware-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the firmware restore pin
        working-directory: tools/release
        run: python -m unittest test_firmware_restore -v
      - name: Install best-effort derivation dependencies
        run: |
          python -m pip install --upgrade brotli
          sudo apt-get update && sudo apt-get install -y e2fsprogs
      - name: Download the pinned Drive firmware (fail soft on quota)
        id: fetch
        shell: python
        run: |
          import json, os, pathlib, sys, urllib.request, urllib.parse, http.cookiejar
          pin = json.loads(pathlib.Path('tools/installer/pins/ha100_firmware_restore.json').read_text())
          file_id = pin['source']['drive_file_id']
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'firmware-ota.zip'
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          base = 'https://drive.google.com/uc?export=download&id=' + urllib.parse.quote(file_id)
          def attempt(url):
              request = urllib.request.Request(url, headers={'User-Agent': 'couch-firmware-watch'})
              return opener.open(request, timeout=120)
          try:
              response = attempt(base)
              head = response.read(65536)
              # Large files interpose an HTML interstitial carrying a confirm token.
              if head[:1000].lstrip().startswith(b'<') or b'Google Drive - Virus scan warning' in head:
                  import re
                  text = head.decode('utf-8', 'replace')
                  token = None
                  match = re.search(r'confirm=([0-9A-Za-z_-]+)', text)
                  if match:
                      token = match.group(1)
                  form = re.search(r'action="(https://[^"]*drive[^"]*download[^"]*)"', text)
                  if form:
                      url = form.group(1).replace('&amp;', '&')
                  else:
                      url = base + ('&confirm=' + token if token else '&confirm=t')
                  if b'quota' in head.lower() or b'too many users have viewed' in head.lower():
                      print('::warning::Google Drive quota reached; skipping without a pull request.')
                      pathlib.Path(os.environ['GITHUB_OUTPUT']).write_text('status=quota\n')
                      sys.exit(0)
                  response = attempt(url)
                  head = b''
              with out.open('wb') as target:
                  if head:
                      target.write(head)
                  while True:
                      chunk = response.read(1 << 20)
                      if not chunk:
                          break
                      target.write(chunk)
          except Exception as error:  # noqa: BLE001 - fail soft, never spam
              print(f'::warning::Firmware download failed ({error}); skipping without a pull request.')
              pathlib.Path(os.environ['GITHUB_OUTPUT']).write_text('status=download-failed\n')
              sys.exit(0)
          # Drive often answers the confirm GET with another HTML page, not the
          # file. Require a real ZIP so a later step never dies on BadZipFile.
          with out.open('rb') as probe:
              magic = probe.read(4)
          if magic != b'PK\x03\x04':
              print('::warning::Drive did not return a ZIP (interstitial or quota); skipping without a pull request.')
              pathlib.Path(os.environ['GITHUB_OUTPUT']).write_text('status=not-a-zip\n')
              sys.exit(0)
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a') as handle:
              handle.write('status=downloaded\n')
              handle.write(f'ota={out}\n')
      - name: Compare against the pinned hash and derive new metadata
        id: compare
        if: steps.fetch.outputs.status == 'downloaded'
        working-directory: tools/release
        shell: python
        run: |
          import hashlib, json, os, pathlib, sys
          # shell: python runs this from a temp file, so cwd (tools/release) is
          # not on sys.path; add it before importing the release module.
          sys.path.insert(0, os.getcwd())
          import firmware_restore
          ota = pathlib.Path(os.environ['OTA'])
          pin = firmware_restore.load()
          digest = hashlib.sha256(ota.read_bytes()).hexdigest()
          output = pathlib.Path(os.environ['GITHUB_OUTPUT'])
          if digest == pin['archive']['sha256'] and ota.stat().st_size == pin['archive']['size']:
              # Re-verify the full derivation still reproduces every pinned value.
              firmware_restore.check(ota, pin)
              output.write_text('changed=false\n')
              print('Vendor firmware still matches the pinned restore values.')
              sys.exit(0)
          # The firmware changed. Derivation may itself fail on an unexpected
          # archive; keep the job green and still open a notice either way.
          try:
              derived = firmware_restore.derive(ota, with_formatter=True)
              derived_block = '```json\n' + json.dumps(derived, indent=2, sort_keys=True) + '\n```\n'
          except Exception as error:  # noqa: BLE001 - report, never go red
              derived_block = f'Automated derivation failed ({error}); derive the new values by hand.\n'
          report = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'tools/release/firmware-drift-report.md'
          report.write_text(
              '# Vendor Android firmware changed\n\n'
              f'The pinned vendor OTA no longer matches the repo pins. New archive sha256 `{digest}`, size {ota.stat().st_size}.\n\n'
              'A maintainer must update, in one reviewed change, all three coupled pins: the archive and member\n'
              'hashes in `ha100_official_runtime.json`, the `BOOTSTRAP_MEMBERS` constant in `prepare_official_inputs.py`,\n'
              'and `ha100_firmware_restore.json` (regenerated with `firmware_restore.py --derive`). No firmware bytes\n'
              'are redistributed. This report file is the drift signal, not a finished pin update.\n\n'
              + derived_block)
          output.write_text('changed=true\n')
        env:
          OTA: ${{ steps.fetch.outputs.ota }}
      - name: Open a review pull request
        if: steps.compare.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: firmware-watch/pin-update
          title: 'firmware: vendor Android OTA changed; update restore pins'
          body: |
            Automated drift detection. The pinned vendor Android OTA changed.
            See `tools/release/firmware-drift-report.md` on this branch for the new
            values and the three coupled pins a maintainer must update together.
            No firmware bytes are redistributed.
          add-paths: tools/release/firmware-drift-report.md
          commit-message: 'firmware: record vendor OTA drift for review'
          labels: firmware-watch
          delete-branch: true
      - name: Optionally upload the firmware for review (opt-in)
        # Redistribution of vendor firmware is not authorized by default. This only
        # uploads when a maintainer explicitly requests it on a manual dispatch.
        if: steps.fetch.outputs.status == 'downloaded' && inputs.upload_firmware_artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-ota
          path: ${{ steps.fetch.outputs.ota }}
          retention-days: 3

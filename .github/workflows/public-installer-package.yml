name: Public installer package
on:
  pull_request:
    paths:
      - 'tools/release/package_public_installer.py'
      - 'tools/release/test_package_public_installer.py'
      - 'tools/release/prepare_public_*.py'
      - 'tools/installer/pins/ha100_official_runtime.json'
      - 'tools/installer/image/**'
      - 'tools/installer/test_neutral_ramdisk.py'
      - 'kernel/release-pin.json'
      - '.github/workflows/public-installer-package.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-installer-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tools/release -p test_package_public_installer.py
      - run: python tools/installer/test_neutral_ramdisk.py

name: Public installer package
on:
  pull_request:
    paths:
      - 'tools/release/package_public_installer.py'
      - 'tools/release/test_package_public_installer.py'
      - 'tools/release/fresh_os.py'
      - 'tools/release/test_fresh_os.py'
      - 'tools/release/verify_integration_set.py'
      - 'tools/release/tested-integrations.json'
      - 'tools/release/*host-compatibility.json'
      - 'tools/release/*host-report.json'
      - 'tools/tests/denon-v1-host-compatibility.py'
      - 'tools/release/prepare_public_*.py'
      - 'tools/release/ha100_official_runtime.json'
      - 'kernel/release-pin.json'
      - '.github/workflows/public-installer-package.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-installer-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      # The reviewed compatibility evidence is authenticated byte-for-byte.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          # Fresh OS admission verifies the tested core's ancestry and contract.
          fetch-depth: 0
      - run: python -m unittest discover -s tools/release -p test_package_public_installer.py

name: Native installer launchers
on:
  pull_request:
    paths:
      - 'tools/installer/bootstrap-native.*'
      - 'tools/release/installer_launchers.py'
      - 'tools/release/test_installer_launchers.py'
      - '.github/workflows/installer-launchers.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify launcher generation and native dispatch
        working-directory: tools/release
        run: python -m unittest test_installer_launchers -v

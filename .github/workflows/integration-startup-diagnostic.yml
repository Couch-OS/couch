name: Integration startup diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/integration-startup-diagnostic.yml'
      - 'clients/couch-plugin/**'
      - 'clients/couch-sonos/tests/admission.rs'
permissions:
  contents: read
jobs:
  startup-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Trace operating-system failures in this disposable checkout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('clients/couch-plugin/src/protocol.rs')
          s = p.read_text()
          marker = '    fn from(e: std::io::Error) -> Self {\n'
          assert s.count(marker) == 1
          p.write_text(s.replace(marker, marker + '        eprintln!("PLUGIN_IO_ERROR: {e:?}");\n'))
          PY
      - name: Stress concurrent fixture startup
        run: |
          cd clients
          cargo test --locked -p couch-sonos --test admission --no-run
          for attempt in $(seq 1 40); do
            echo "Startup attempt $attempt"
            cargo test --locked -p couch-sonos --test admission concurrent_package_startup_is_offline_and_race_free -- --exact --nocapture
          done

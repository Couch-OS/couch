name: Frozen Windows launcher acceptance
on:
  pull_request:
    paths:
      - 'tools/installer/acceptance/**'
      - 'tools/installer/installer_launchers.py'
      - 'tools/installer/release_descriptor.py'
      - 'tools/installer/bootstrap-native.*'
      - 'tools/installer/binary_receipt.py'
      - '.github/workflows/installer-windows-launcher-acceptance.yml'
  workflow_dispatch:
    inputs:
      installer_repository:
        description: Independently reviewed installer source and binary repository
        type: choice
        required: true
        default: dangerouslaser/couch
        options:
          - dangerouslaser/couch
          - dangerouslaser/couch-installer
      source_commit:
        description: Independently recorded host source SHA (must match run, receipts and generator)
        required: true
        default: 57a3e22b4e86d8d6620dbaedbf30847e26b9bbd4
      payload_source_commit:
        description: Independently recorded OS payload source SHA (must match config)
        required: true
        default: 271704728c77c13add1763aea7d1f9bd629c63ca
      installer_version:
        description: Independently recorded installer version (must match receipts and config)
        required: true
        default: v0.1.0
      os_version:
        description: Independently recorded OS version (must match config)
        required: true
        default: v0.1.0-alpha.20260910.24
      binary_run_id:
        description: Successful frozen Build installer binaries run ID
        required: true
      config_base64:
        description: Exact public installer.json bytes, base64 encoded
        required: true
      config_sha256:
        description: Independently recorded final installer.json SHA-256
        required: true
      launcher_sha256:
        description: Independently recorded final install.ps1 SHA-256
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: installer-windows-launcher-acceptance-${{ github.event.pull_request.number || github.ref }}
  # A dispatched acceptance run carries hand-recorded pins and must finish;
  # only a superseded pull request run is worth cancelling.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            tools/installer/acceptance
            tools/installer/installer_launchers.py
            tools/installer/release_descriptor.py
            tools/installer/test_release_descriptor.py
            tools/installer/bootstrap-native.sh.in
            tools/installer/bootstrap-native.ps1.in
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate fixture source and admission boundaries
        shell: pwsh
        run: |
          python -m unittest discover -s tools/installer/acceptance -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Fixture tests failed' }
          python tools/installer/test_release_descriptor.py
          if ($LASTEXITCODE -ne 0) { throw 'Descriptor tests failed' }
          foreach ($path in Get-ChildItem tools/installer/acceptance/*.ps1) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
  final-launcher:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      PAYLOAD_SOURCE_COMMIT: ${{ inputs.payload_source_commit }}
      INSTALLER_VERSION: ${{ inputs.installer_version }}
      INSTALLER_REPOSITORY: ${{ inputs.installer_repository }}
      OS_VERSION: ${{ inputs.os_version }}
      BINARY_RUN_ID: ${{ inputs.binary_run_id }}
      CONFIG_BASE64: ${{ inputs.config_base64 }}
      CONFIG_SHA256: ${{ inputs.config_sha256 }}
      LAUNCHER_SHA256: ${{ inputs.launcher_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: acceptance
          sparse-checkout: tools/installer/acceptance
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.installer_repository }}
          token: ${{ secrets.INSTALLER_ARTIFACT_TOKEN || github.token }}
          persist-credentials: false
          ref: ${{ inputs.source_commit }}
          path: frozen
          sparse-checkout: |
            tools/installer/installer_launchers.py
            tools/installer/release_descriptor.py
            tools/installer/bootstrap-native.sh.in
            tools/installer/bootstrap-native.ps1.in
            tools/release/installer_launchers.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.INSTALLER_ARTIFACT_TOKEN || github.token }}
          repository: ${{ inputs.installer_repository }}
          run-id: ${{ inputs.binary_run_id }}
          pattern: couch-installer-*
          path: downloaded
      - name: Verify source receipts, binaries and final launcher pins
        env:
          GH_TOKEN: ${{ secrets.INSTALLER_ARTIFACT_TOKEN || github.token }}
        shell: pwsh
        run: |
          python acceptance/tools/installer/acceptance/prepare.py downloaded frozen candidate
          if ($LASTEXITCODE -ne 0) { throw 'Artifact admission failed' }
      - name: Execute unchanged final PowerShell launcher and select Cancel
        shell: powershell
        run: acceptance/tools/installer/acceptance/windows_launcher.ps1 -Candidate candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-windows-launcher-acceptance
          path: |
            candidate/admission.json
            candidate/result.json
            candidate/requests.json
            candidate/console.txt
            candidate/https-error.txt
          if-no-files-found: error

name: Runtime OS compatibility
on:
  pull_request:
    paths:
      - 'daemon/couch-updates/**'
      - 'daemon/Cargo.lock'
      - 'tools/release/**'
      - 'tools/installer/image/**'
      - 'tools/installer/pins/**'
      - 'tools/installer/source/**'
      - 'tools/tests/test_runtime_update_boot.py'
      - 'stage2/runtime-boot.sh'
      - '.github/workflows/runtime-os-compatibility.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-os-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Tested package sets compare their recorded core contract to HEAD.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --manifest-path daemon/Cargo.toml -p couch-updates --check
      - run: cargo test --manifest-path daemon/Cargo.toml -p couch-updates --locked
      - run: cargo clippy --manifest-path daemon/Cargo.toml -p couch-updates --all-targets --locked -- -D warnings
      - run: python3 -m unittest discover -s tools/release -p 'test_*.py'
      # The compatibility floor. A runtime bundle is refused before download by
      # any updater whose allowlist does not know every name in it, and a check
      # offers only the newest release, so one unknown name strands every remote
      # on the oldest deployed updater until a full OS reinstall. This prints
      # the exact bundle a promotion from this tree would publish and fails if
      # that updater would refuse it (docs/runtime-updates.md).
      - run: python3 tools/release/update_floor.py --inventory
      - run: python3 tools/tests/test_runtime_update_boot.py

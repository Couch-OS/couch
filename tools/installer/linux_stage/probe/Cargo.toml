[package]
name = "couch-installer-probe"
version = "0.1.0"
edition = "2021"

[workspace]

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

[dependencies]
zeroize = { version = "1", optional = true }
couch-installer-storage = { path = "../storage", optional = true }
sha2 = { version = "0.10", optional = true }
libc = { version = "0.2", optional = true }
crc32fast = { version = "1", optional = true }
flate2 = { version = "1", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"

[features]
private-install = ["dep:zeroize", "dep:couch-installer-storage", "dep:sha2", "dep:libc", "dep:crc32fast", "dep:flate2"]

[package]
name = "couch-installer-probe"
version = "0.1.0"
edition = "2021"

[workspace]

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"

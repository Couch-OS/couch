[package]
name = "couch-confd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Config server for Couch: the REST API and the web UI it serves"

# tiny_http rather than axum. axum is the better library for a service; it is
# the wrong one for this device. It arrives with tokio, hyper, tower and their
# transitive halves - a reactor, a work-stealing scheduler and a connection
# pool, to answer a handful of requests from one browser on the LAN. On a
# quad-A7 with a rootfs living in a phone flash partition, that is megabytes of
# binary and a compile that dwarfs everything else in the repo, bought for
# concurrency this workload does not have. tiny_http is blocking sockets and a
# request queue, four dependencies deep, and a fixed thread pool covers the six
# connections a browser opens. It also has no C in it, which is what keeps the
# static musl cross-build a one-liner - the constraint that has already cost
# this project a day over yeslogic-fontconfig-sys.
[dependencies]
couch-sonos = { path = "../../clients/couch-sonos" }
couch-coreelec = { path = "../../clients/couch-coreelec" }
couch-system = { path = "../couch-system" }
couch-unifi-protect = { path = "../../clients/couch-unifi-protect" }
flate2 = "1"
couch-ir = { path = "../../clients/couch-ir" }
couch-control = { path = "../../clients/couch-control" }
couch-denon = { path = "../../clients/couch-denon" }
couch-model = { path = "../../model/couch-model" }
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

couch-ha = { path = "../../clients/couch-ha" }
couch-hue = { path = "../../clients/couch-hue" }

couch-webos = { path = "../../clients/couch-webos" }

couch-kodi = { path = "../../clients/couch-kodi" }

couch-androidtv = { path = "../../clients/couch-androidtv" }
couch-appletv = { path = "../../clients/couch-appletv" }
mdns-sd = "0.13"

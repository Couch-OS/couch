[package]
name = "couch-system"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
couch-updates = { path = "../couch-updates" }
# The lib half only (socket path, key words, pairing state file): no zbus, no
# tokio. The service forwards pairing-mode words to the HID daemon's socket and
# reads its state file, so the web daemon needs no socket code of its own.
couch-bt-hid = { path = "../../clients/couch-bt-hid", default-features = false }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package]
name = "couch-control"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
couch-sdk = { path = "../couch-sdk" }
couch-kodi = { path = "../couch-kodi" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
couch-androidtv = { path = "../couch-androidtv" }
couch-appletv = { path = "../couch-appletv" }
couch-tizen = { path = "../couch-tizen" }

[dev-dependencies]
prost = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# Clients share a target, linker configuration, release profile and SDK in one
# workspace. External integration executables are packaged independently using
# their manifest versions and the couch-plugin protocol; building one does not
# require rebuilding the daemon or either UI.
[workspace]
resolver = "2"
members = ["couch-plugin", "couch-sdk", "couch-echo", "couch-kodi", "couch-voice", "couch-ir", "couch-ha", "couch-hue", "couch-webos", "couch-control", "couch-androidtv", "couch-appletv", "couch-sonos", "couch-coreelec", "couch-unifi-protect", "couch-matter", "couch-tizen", "couch-bt", "couch-bt-hid"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package]
name = "couch-hue"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
couch-ha = { path = "../couch-ha" }
couch-sdk = { path = "../couch-sdk", features = ["tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "=3.4.1", default-features = false, features = ["rustls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
url = "2"

[dev-dependencies]
tiny_http = "0.12"
# Throwaway bridge certificates for tests/pinned_certificate.rs.
rcgen = "0.13"

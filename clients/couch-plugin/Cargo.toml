[package]
name = "couch-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Versioned subprocess integration protocol and bounded Couch host"

[features]
testing = ["couch-sdk/testing"]
# Kept as a no-op compatibility feature for packages developed against the
# protocol 3 preview. Protocol 3 is now the normal host contract.
protocol-3-preview = []
# Kept as a no-op compatibility feature for packages developed while the
# protocol-4 camera transport was in preview. Protocol 4 is now the host.
protocol-4-preview = []

# The package `tests/isolation.rs` starts as two different users. It is a real
# package and not a shell script, so that it goes through `serve`, which is
# where a child stops being dumpable. `testing` is off in every shipped build,
# and so is this binary.
[[bin]]
name = "couch-plugin-probe"
path = "src/bin/couch-plugin-probe.rs"
required-features = ["testing"]

[[test]]
name = "isolation"
path = "tests/isolation.rs"
required-features = ["testing"]

[dependencies]
base64 = "0.22"
couch-sdk = { path = "../couch-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[package]
name = "couch-denon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Denon AVR main-zone control over its native TCP protocol"
[dependencies]
couch-plugin = { path = "../couch-plugin" }
couch-sdk = { path = "../couch-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The SDK's scripted fake receiver replaces the hand-rolled TCP servers these
# tests would otherwise need, and lets the contract check run here.
[dev-dependencies]
couch-sdk = { path = "../couch-sdk", features = ["testing"] }
couch-plugin = { path = "../couch-plugin", features = ["testing"] }

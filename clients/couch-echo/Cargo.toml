[package]
name = "couch-echo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A worked example integration for couch-sdk: copy this crate to start a new client"

# The template a new client starts from, and the only crate here that talks to a
# device that does not exist. Its "TV" is couch_sdk::testing::MockHost, so this
# builds, runs and passes its tests on any machine - no remote, no TV, no
# credentials, no network beyond loopback.
# This feature builds the fixture in src/v3.rs so tests/protocol3.rs can run a
# protocol 3 package end to end. The normal host accepts protocol 3 with or
# without the fixture feature. Run with
# `cargo test -p couch-echo --features protocol-3-preview`.
[features]
protocol-3-preview = ["couch-plugin/protocol-3-preview"]

[[bin]]
name = "couch-plugin-echo-v3"
path = "src/bin/couch-plugin-echo-v3.rs"
required-features = ["protocol-3-preview"]

[[bin]]
name = "couch-plugin-echo-bridge"
path = "src/bin/couch-plugin-echo-bridge.rs"
required-features = ["protocol-3-preview"]

[[bin]]
name = "couch-plugin-echo-pair"
path = "src/bin/couch-plugin-echo-pair.rs"
required-features = ["protocol-3-preview"]

[[bin]]
name = "couch-plugin-echo-pair-hostile"
path = "src/bin/couch-plugin-echo-pair-hostile.rs"
required-features = ["protocol-3-preview"]

[[test]]
name = "protocol3"
required-features = ["protocol-3-preview"]

[dependencies]
couch-plugin = { path = "../couch-plugin" }
serde_json = "1"
couch-sdk = { path = "../couch-sdk" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
couch-sdk = { path = "../couch-sdk", features = ["testing"] }
couch-plugin = { path = "../couch-plugin", features = ["testing"] }

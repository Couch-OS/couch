[package]
name = "couch-unifi-protect"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Read-only UniFi Protect camera, snapshot and RTSPS discovery for Couch"

[dependencies]
couch-camera = { path = "../couch-camera", optional = true }
couch-sdk = { path = "../couch-sdk", features = ["tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "=3.4.1", default-features = false, features = ["rustls"] }
url = "2"
zeroize = "1"

sha2 = "0.10"
base64 = "0.22"
webrtc-srtp = { version = "=0.17.2", optional = true }
webpki-roots = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
rcgen = "0.13"

[features]
media-transport = ["dep:webrtc-srtp"]
# The built-in bridge keeps its player for migration acceptance. An external
# package needs only `media-transport`; decoding belongs to Couch core.
media = ["media-transport", "dep:couch-camera"]

[[example]]
name = "watch"
required-features = ["media"]

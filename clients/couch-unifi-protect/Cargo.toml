[package]
name = "couch-unifi-protect"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Read-only UniFi Protect camera, snapshot and RTSPS discovery for Couch"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "=3.4.1", default-features = false, features = ["rustls"] }
url = "2"
zeroize = "1"

sha2 = "0.10"
base64 = "0.22"
webrtc-srtp = { version = "=0.17.2", optional = true }
webpki-roots = "1"
libc = { version = "0.2", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
rcgen = "0.13"

[features]
media = ["dep:webrtc-srtp", "dep:libc"]

[[example]]
name = "watch"
required-features = ["media"]

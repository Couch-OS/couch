<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=480, initial-scale=1"><title>Couch Slint preview</title>
<style>html,body{margin:0;width:480px;height:800px;overflow:hidden;background:#15130f}canvas{display:block;width:480px;height:800px;outline:none;touch-action:none}</style></head>
<body><canvas id="canvas" width="480" height="800" tabindex="0" aria-label="Couch remote touchscreen. Use the physical controls below the preview."></canvas>
<script type="module">
const send = (type, data={}) => parent.postMessage({couchPreview:type,...data},location.origin);
try {
  // Emulate the remote's fixed framebuffer inside this isolated frame.
  // Winit must use CSS size × our DPR, including on browsers whose native
  // ResizeObserver reports physical Retina pixels independently of DPR.
  Object.defineProperty(window, 'devicePixelRatio', {value:1, configurable:true});
  delete ResizeObserverEntry.prototype.devicePixelContentBoxSize;
  const {default:init,remote_button,state_json,documentation_screen}=await import('./wasm/couch_preview.js');
  const canvas = document.querySelector('canvas');
  canvas.width = Math.round(480 * devicePixelRatio);
  canvas.height = Math.round(800 * devicePixelRatio);
  try { await init(); } catch(error) {
    // Winit 0.30 hands its event loop to the browser with this sentinel.
    if (!String(error).includes("Using exceptions for control flow, don't mind me. This isn't actually an error!")) throw error;
  }
  window.couchDemo = {remote_button, documentation_screen, state:()=>JSON.parse(state_json())};
  send('ready');
  // Device page transitions copy framebuffer images. Reproduce that host work
  // with canvas snapshots; the Slint component tree remains unchanged.
  let snapshot=null, oldRoute=null, animations=[];
  const route=state=>JSON.stringify([state.room,state.player,state.chooser]);
  const capture=()=>{
    animations.forEach(a=>a.cancel()); animations=[];
    document.querySelectorAll('.page-snapshot').forEach(e=>e.remove());
    snapshot=document.createElement('canvas');snapshot.width=canvas.width;snapshot.height=canvas.height;
    snapshot.getContext('2d').drawImage(canvas,0,0);
    oldRoute=JSON.parse(state_json());
  };
  const transition=state=>{
    if(!snapshot || !oldRoute || route(state)===route(oldRoute))return;
    const old=snapshot;snapshot=null;
    if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    const depth=s=>(s.room!==null?1:0)+(s.player?1:0)+(s.chooser?1:0);
    const direction=depth(state)>=depth(oldRoute)?1:-1;
    old.className='page-snapshot';old.style.cssText='position:absolute;inset:0;pointer-events:none;width:480px;height:800px';
    document.body.append(old);
    const options={duration:220,easing:'cubic-bezier(.2,.7,.2,1)'};
    const outgoing=old.animate([{transform:'translateX(0)'},{transform:`translateX(${-direction*480}px)`}],options);
    const incoming=canvas.animate([{transform:`translateX(${direction*480}px)`},{transform:'translateX(0)'}],options);
    animations=[outgoing,incoming];outgoing.finished.then(()=>old.remove()).catch(()=>old.remove());
  };
  ['pointerdown','keydown','wheel'].forEach(type=>document.addEventListener(type,event=>{if(event.isTrusted)send('interaction');},{capture:true,passive:true}));
  canvas.addEventListener('pointerdown',capture);
  canvas.addEventListener('keydown',capture);
  canvas.addEventListener('keydown',event=>{const name={'+':'volume-up','-':'volume-down',PageUp:'channel-up',PageDown:'channel-down'}[event.key];if(name){event.preventDefault();remote_button(name);}});
  // The cropped browser bezel has no OK key. Let Slint select the row first,
  // then activate it. These hit bounds describe the fixed local fixture's
  // native whole-row layout (home_hub.slint and room_devices.slint).
  let touchStart=null;
  const point=event=>{const r=canvas.getBoundingClientRect();return {x:(event.clientX-r.left)*480/r.width,y:(event.clientY-r.top)*800/r.height};};
  canvas.addEventListener('pointerdown',event=>{touchStart={...point(event),state:JSON.parse(state_json())};});
  canvas.addEventListener('pointerup',event=>{
    if(!touchStart)return;
    const start=touchStart,end=point(event);touchStart=null;
    if(start.state.player || start.state.chooser || start.state.tv || start.state.thermostat)return;
    if(Math.abs(end.y-start.y)>28){remote_button(end.y<start.y?'down':'up');return;}
    if(Math.hypot(end.x-start.x,end.y-start.y)>12 || end.x<20 || end.x>460)return;
    const inRoom=start.state.room!==null;
    const top=inRoom?80:172,pitch=inRoom?115.2:114.75,height=inRoom?103.2:102.75,count=inRoom?3:4;
    const offset=end.y-top;
    if(offset<0 || offset>=count*pitch || offset%pitch>height)return;
    setTimeout(()=>{if(route(JSON.parse(state_json()))===route(start.state))remote_button('ok');},40);
  });
  let previous='';
  setInterval(()=>{const state=state_json();if(state!==previous){previous=state;const parsed=JSON.parse(state);transition(parsed);send('state',{state:parsed});}},32);
  addEventListener('message',event=>{if(event.origin===location.origin && event.source===parent && event.data?.couchPreview==='button') {capture();remote_button(event.data.name);}});
  let lastWheel=0;
  document.querySelector('canvas').addEventListener('wheel',event=>{event.preventDefault();if(Date.now()-lastWheel>150){remote_button(event.deltaY>0?'down':'up');lastWheel=Date.now();}},{passive:false});
} catch(error) {send('error',{message:'The interactive preview could not load. Please reload or try a current browser.'}); console.error(error);}
</script></body></html>
